<div class="app-shell" [class.student-surface]="showStudentSurface">
  <app-language-toggle></app-language-toggle>

  @if (showPageNavigation) {
    <nav class="page-navigation" aria-label="页面导航">
      <button type="button" (click)="goHome()">{{ homeLabel }}</button>
      <button type="button" (click)="goBack()">{{ backLabel }}</button>
      <button type="button" [disabled]="signingOut" (click)="signOut()">
        {{ globalSignOutLabel }}
      </button>
    </nav>
  }

  <router-outlet></router-outlet>
</div>
